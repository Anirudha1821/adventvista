<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4f0" />
    <meta name="description" content="Explore AdventVista's creative work for hospitality and food brands. See client case studies and request a free digital brand audit." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      try {
        const savedTheme = localStorage.getItem('adventvista-theme');
        document.documentElement.dataset.theme = savedTheme === 'dark' || savedTheme === 'light'
          ? savedTheme
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <title>AdventVista — Make them feel something.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
